services:
  postgres:
    image: postgres:16-alpine
    container_name: lifelink-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lifelink_user
      POSTGRES_PASSWORD: lifelink_password
      POSTGRES_DB: lifelink_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelink_user -d lifelink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
